---
name: Release

# yamllint disable-line rule:truthy
on:
  push:
    tags:
      - "[0-9]*"

permissions: {}

jobs:
  validate:
    name: Pre-release Validation
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@v8.2.0
        with:
          # No cache: a tag build must not read anything a pull request
          # could have written.
          enable-cache: false
      - run: uv sync --frozen --group dev --group test
      - run: uv run ruff check .
      - run: uv run pytest -q

  release:
    name: Create GitHub Release
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: astral-sh/setup-uv@v8.2.0
        with:
          enable-cache: false

      - run: uv sync --group dev

      - name: Extract tag version
        id: meta
        run: |
          TAG_VERSION="${GITHUB_REF#refs/tags/}"
          echo "version=$TAG_VERSION" >> "$GITHUB_OUTPUT"
          # PEP 440 pre-release suffixes (a / b / rc).
          if echo "$TAG_VERSION" | grep -qE '[0-9]+\.[0-9]+\.[0-9]+(a|b|rc)[0-9]+'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      # HACS reads manifest.json; `cz bump` writes both. A tag that disagrees
      # with either would ship a version nobody can trace.
      - name: Verify version consistency
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PYPROJECT_VERSION=$(python3 -c "
          import tomllib
          with open('pyproject.toml', 'rb') as f:
              print(tomllib.load(f)['project']['version'])
          ")
          MANIFEST_VERSION=$(python3 -c "
          import json
          with open('custom_components/hojo_tts/manifest.json') as f:
              print(json.load(f)['version'])
          ")
          echo "Tag: $TAG_VERSION / pyproject: $PYPROJECT_VERSION / manifest: $MANIFEST_VERSION"
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ] || [ "$TAG_VERSION" != "$MANIFEST_VERSION" ]; then
            echo "::error::Version mismatch — run 'uv run cz bump' rather than tagging by hand"
            exit 1
          fi

      - name: Generate release notes
        env:
          TAG_VERSION: ${{ steps.meta.outputs.version }}
        run: |
          PREV_TAG=$(git tag --sort=-v:refname | grep -v "^${TAG_VERSION}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            uv run cz changelog --dry-run --start-rev "$PREV_TAG" > body.md
          else
            uv run cz changelog --dry-run > body.md
          fi
          cat body.md

      - name: Create release archive
        run: |
          cd custom_components/hojo_tts
          zip -r ../../hojo_tts.zip .

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG_VERSION: ${{ steps.meta.outputs.version }}
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
        run: |
          GH_ARGS=()
          if [ "$PRERELEASE" = "true" ]; then
            GH_ARGS+=(--prerelease)
          fi
          gh release create "$TAG_VERSION" \
            "${GH_ARGS[@]}" \
            --notes-file body.md \
            hojo_tts.zip
