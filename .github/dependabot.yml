---
version: 2
updates:
  - package-ecosystem: "uv"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "python"]
    # Wait before opening a PR — avoid 0-day regressions.
    cooldown:
      default-days: 7
      semver-major-days: 30
    groups:
      dev-deps:
        patterns: ["*"]
        exclude-patterns: ["pytest*", "voluptuous", "sentence-stream"]
        update-types: ["minor", "patch"]
      test-deps:
        patterns: ["pytest*", "voluptuous"]
        update-types: ["minor", "patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    labels: ["dependencies", "github-actions"]
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
